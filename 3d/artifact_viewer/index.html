<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Artifact Viewer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <h1>3D артефакты</h1>
          <div id="status">Загрузка списка...</div>
        </div>
        <div class="panel upload-panel">
          <h2>Подкинуть файл</h2>
          <label class="upload-button">
            <input id="upload-input" type="file" accept=".ply,.npz,.npy" hidden>
            <span>Выбрать файл</span>
          </label>
          <div id="drop-zone" class="drop-zone">
            Перетащи сюда `ply / npz / npy`
          </div>
          <div class="upload-hint">Файл загружается в локальную папку viewer и сразу появляется в списке.</div>
        </div>
        <div class="panel controls" id="volume-controls" hidden>
          <h2>Параметры объёма</h2>
          <label>
            Порог
            <input id="threshold-range" type="range" min="0" max="1" step="0.0001">
          </label>
          <input id="threshold-number" type="number" step="0.0001">
          <label>
            Макс. точек
            <input id="max-points" type="number" min="1000" max="500000" step="1000" value="120000">
          </label>
          <button id="reload-volume">Перестроить</button>
          <div id="volume-meta"></div>
        </div>
        <div class="panel list-panel">
          <input id="filter-input" type="search" placeholder="Фильтр по имени">
          <div id="artifact-list" class="artifact-list"></div>
        </div>
      </aside>
      <main class="viewer-shell">
        <div class="toolbar">
          <div id="selection-title">Файл не выбран</div>
          <div class="toolbar-actions">
            <button id="fit-view">Вписать</button>
            <button id="toggle-grid">Сетка</button>
          </div>
        </div>
        <div id="viewer"></div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
